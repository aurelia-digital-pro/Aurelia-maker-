name: AURELIA Maker — Repair Stage 1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install media dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng fonts-dejavu fontconfig
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q aurelia scripts
      - name: Real local visual and TTS smoke
        run: PYTHONPATH=. python -u scripts/repair_acceptance_smoke.py
