<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AURELIA Maker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <span class="logo">◈</span>
        <div>
          <h1>AURELIA Maker</h1>
          <p>Chat → Factory → Cinematic Production → FINAL MP4</p>
        </div>
      </div>
      <div class="header-actions">
        <span id="factory-status" class="badge ok">Factory Connected</span>
      </div>
    </header>

    <main class="main">
      <aside class="sidebar">
        <section>
          <h2>Projects</h2>
          <ul id="episode-list" class="episode-list"></ul>
        </section>
        <section>
          <h2>Production Jobs</h2>
          <ul id="job-list" class="job-list"></ul>
        </section>
      </aside>

      <section class="workspace">
        <div class="progress-panel" id="progress-panel" hidden>
          <div class="progress-header">
            <span id="progress-stage">—</span>
            <span id="progress-pct">0%</span>
          </div>
          <div class="progress-bar"><div id="progress-fill"></div></div>
        </div>

        <div class="video-panel" id="video-panel" hidden>
          <h2>Final MP4</h2>
          <video id="final-video" controls></video>
          <a id="download-link" class="btn" download>Download FINAL MP4</a>
        </div>

        <div class="chat-panel">
          <div id="chat-messages" class="chat-messages"></div>
          <form id="chat-form" class="chat-form">
            <textarea
              id="chat-input"
              rows="9"
              placeholder="أنشئ فيلمًا وثائقيًا سينمائيًا بالعربية عن ...
العنوان: ...
اللغة: ar

[محتوى السيناريو هنا]
---
Create Episode 0001
Title: ...
Language: en

[script here]"
              autocomplete="off"
            ></textarea>
            <button type="submit" class="btn primary">Send ▶</button>
          </form>
        </div>
      </section>

      <aside class="terminal-panel">
        <h2>Factory Terminal</h2>
        <pre id="terminal-output" class="terminal"></pre>
      </aside>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
